name: Push Search Data to Algolia

# Triggers the script every time code is merged into the main branch
on:
  push:
    branches:
      - main

jobs:
  update-algolia-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Algolia Indexing Script
        # This securely injects the secrets you saved in GitHub into the Node script
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: node scripts/index-to-algolia.js
